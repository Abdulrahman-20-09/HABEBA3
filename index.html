<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💗</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ef;--bg2:#ffc2dc;--pink:#ff5fa2;--deep:#d81b78;--text:#8a1450;--soft:#fff0f7;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1028;--bg2:#5a1a3e;--pink:#ff6fb0;--deep:#ff3d94;--text:#ffd3e8;--soft:#4a1634}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Cairo',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;overflow:hidden;text-align:center}
h1{font-size:clamp(24px,7vw,36px);margin:0;font-weight:800;min-height:1.6em;transition:opacity .4s}
.wrap{width:min(70vw,300px);transition:transform .3s}
svg{width:100%;height:auto;overflow:visible;filter:drop-shadow(0 8px 18px rgba(216,27,120,.35))}
.beat{animation:beat 1.1s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.06)}}
.shake{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(2px,0) rotate(1deg)}50%{transform:translate(-2px,1px) rotate(-1deg)}100%{transform:translate(2px,-1px) rotate(1deg)}}
.count{font-size:clamp(34px,10vw,52px);font-weight:800;color:var(--deep)}
.sub{font-size:20px;min-height:1.6em;opacity:0;transition:opacity .6s}
.sub.show{opacity:1}
.emoji{font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif;font-size:clamp(110px,40vw,190px);line-height:1;animation:pop .5s cubic-bezier(.3,1.6,.5,1),wobble .6s .5s infinite alternate}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes wobble{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.fly{position:fixed;bottom:-30px;font-size:24px;animation:up linear forwards;pointer-events:none}
@keyframes up{to{transform:translateY(-110vh) rotate(25deg);opacity:0}}
</style>
</head>
<body>
<h1 id="title">بجد عاوز اقولك يحبيبع</h1>
<div class="wrap beat" id="wrap">
<svg viewBox="-6 -6 112 102">
<defs><clipPath id="h"><path id="hp" d="M50 85C10 55 0 30 0 20 0 8 10 0 22 0c12 0 22 8 28 18C56 8 66 0 78 0c12 0 22 8 22 20 0 10-10 35-50 65z"/></clipPath>
<radialGradient id="g" cx="50%" cy="45%" r="60%"><stop offset="0" stop-color="#ff9ccb"/><stop offset="1" stop-color="#ff3d94"/></radialGradient></defs>
<use href="#hp" fill="var(--soft)"/>
<g clip-path="url(#h)"><circle id="dot" cx="50" cy="40" r="0" fill="url(#g)"/></g>
<use href="#hp" fill="none" stroke="var(--pink)" stroke-width="3" stroke-linejoin="round"/>
</svg>
</div>
<div class="count" id="count">1</div>
<div class="sub" id="sub"></div>
<script>
var dot=document.getElementById('dot'),cnt=document.getElementById('count'),wrap=document.getElementById('wrap'),sub=document.getElementById('sub'),title=document.getElementById('title');
function set(n){cnt.textContent=n+'%';dot.setAttribute('r',Math.min(n,100)/100*62)}
function ease(t){return 1-Math.pow(1-t,2)}
function run(from,to,ms,fn,done){var s=performance.now();(function f(now){var t=Math.min((now-s)/ms,1);fn(Math.max(from+1,Math.round(from+(to-from)*ease(t))));if(t<1)requestAnimationFrame(f);else done&&done()})(s)}
function hearts(n){for(var i=0;i<n;i++){var h=document.createElement('div');h.className='fly';h.textContent=['💗','💖','💕','🌸'][i%4];h.style.left=Math.random()*95+'vw';h.style.animationDuration=(3+Math.random()*3)+'s';h.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(h);setTimeout(function(x){x.remove()},7000,h)}}
set(1);
run(1,99,5000,set,function(){
  wrap.style.display='none';
  var em=document.createElement('div');em.className='emoji';em.textContent='😂';
  wrap.parentNode.insertBefore(em,wrap);
  title.textContent='ي اوزعه ي 149';
});
</script>
</body>
</html>
